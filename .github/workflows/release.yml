name: Release

# Publishing runs here rather than from a laptop so releases carry provenance,
# which requires the OIDC token only CI can mint.
#
# Authentication has two paths, and the workflow picks one on its own:
#
#   1. Trusted publishing (preferred). npm authenticates this workflow directly
#      over OIDC, no secret exists, and provenance is automatic. Configure it at
#      npmjs.com under the package's Settings -> Trusted Publisher, pointing at
#      this repository and `release.yml`.
#   2. A token. Trusted publishing cannot be registered until the package exists
#      on npm, so the very first release needs an NPM_TOKEN secret.
#
# The switch is deleting the NPM_TOKEN secret. Do not edit this file for it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Also an approval gate: publishing claims a name permanently, so add
    # required reviewers here if a release should need a human click.
    environment: npm
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc auth line that would be empty on
      # the OIDC path. The token path configures auth itself.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Install an npm that supports trusted publishing
        run: npm install -g "npm@^11.5.1"

      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

      - name: Publish via trusted publishing
        if: env.HAS_NPM_TOKEN != 'true'
        run: npm publish

      - name: Publish with a token
        if: env.HAS_NPM_TOKEN == 'true'
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
